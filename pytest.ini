[pytest]
testpaths = tests
# Los módulos del proyecto (config, rag, api) se importan desde la raíz.
pythonpath = .
# -rs muestra siempre por qué se salteó un test (por ejemplo, si no hay base).
addopts = -rs
markers =
    eval: evaluación con el proveedor real (lenta; necesita modelos y documentos indexados). Se activa con --run-eval.
